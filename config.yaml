# Project Configuration

# Data Paths
DATA_PATH: "data/f1_strategy_dataset_v4.csv"
PARAMS_PATH: "data/best_params.json"

# Model Hyperparameters (Default)
DEFAULT_PARAMS:
  learning_rate: 0.05
  num_leaves: 31
  max_depth: -1
  min_child_samples: 20
  subsample: 1.0
  colsample_bytree: 1.0
  reg_alpha: 0.1
  reg_lambda: 0.1
  min_data_for_leaf: 20
  min_data_for_host: 1
  feature_fraction: 1.0
  bagging_fraction: 1.0
  bagging_freq: 0
  verbose: 0
  seed: 42
  random_state: 42
  n_jobs: -1

# Optuna Settings
OPTUNA_TRIALS: 50
OPTUNA_N_JOBS: -1
OPTUNA_PRUNER: "tpg"
OPTUNA_SAMPLER: "tpes"
